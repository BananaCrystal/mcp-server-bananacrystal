# Smithery.ai configuration for BananaCrystal MCP Server
# https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  command: "npx"
  args: ["-y", "@bananacrystal/mcp-server"]
  env:
    BANANACRYSTAL_API_KEY: "${BANANACRYSTAL_API_KEY}"

displayName: "BananaCrystal Payment Infrastructure"
description: "Agent payment infrastructure MCP server for autonomous payments, currency swaps, and real-time Hedera rates."
homepage: "https://agents.bananacrystal.com"
repository: "https://github.com/BananaCrystal/mcp-server-bananacrystal"
iconUrl: "https://www.bananacrystal.com/wp-content/uploads/2024/08/cropped-favicon-32x32.png"

environment:
  BANANACRYSTAL_API_KEY:
    type: string
    description: "Your BananaCrystal API Key (generated at https://agents.bananacrystal.com under Account -> API Keys)"
    required: true
    secret: true

examples:
  - prompt: "What is the exchange rate for USD to EUR?"
    call: "get_exchange_rate({ from: 'USD', to: 'EUR' })"
  - prompt: "Check my available wallet balances"
    call: "get_wallet_balances({})"

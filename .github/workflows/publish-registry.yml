name: Publish to the MCP Registry

# Run by hand from the Actions tab after a server.json change is merged to main.
# Only people with write access to this repo can start it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install mcp-publisher 1.8.8 (checksum pinned)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.8/mcp-publisher_linux_amd64.tar.gz
          echo "09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Log in with the bananacrystal.com DNS key
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain bananacrystal.com --private-key "$MCP_REGISTRY_PRIVATE_KEY" > /dev/null

      - name: Publish
        run: ./mcp-publisher publish
